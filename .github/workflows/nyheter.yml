# Nyhetene (fase 7b, avgjørelse 084 og 098): henter kildene i content/nyheter/kilder.yaml hver time til
# data/nyheter/nyheter.json. Filen ligger på grenen nyheter, som har én commit som skrives over (som grep-lager,
# avgjørelse 060), så nyhetene ikke gir commits på main. Passer filen skjemaet og testene for nyhetene, lagres den der,
# og appen publiseres på nytt etter hver henting (deploy.yml henter nyhetene fra grenen), så tidspunktet for hentingen i
# appen alltid er det siste (avgjørelse 116). Feiler en kilde, står sakene fra før, og kilden får status i filen og i
# kildesjekken.
#
# Feiler en nyhetskilde i mer enn to dager, kommer den i saken med etiketten «nyheter». Feiler arbeidsflyten, kommer
# den i saken med etiketten «feil» (avgjørelse 085).
#
# Oppetiden (avgjørelse 099): Hver kjøring sjekker også at jukselappen.no svarer. Svarer den ikke, prøves det igjen
# etter ti minutter, og svarer den ikke da heller, kommer saken «Feil i automatikken: Oppetid» (etikett «feil»).
#
# I PR-er som endrer hentingen eller kildene, og ved manuell kjøring, prøvehentes også prøvekildene (npm run
# nyheter:prove). Rapporten står i sammendraget for kjøringen. En PR lagrer ingenting.
name: Nyheter

on:
  # GitHub starter planlagte kjøringer i dette repoet 6,5–7 timer for sent (08.10.2026: 05.47 kom 12.57 og 13.17 kom
  # 19.53, kildesjekken 7 timer for sent). Derfor kjører hentingen hver time: med samme forsinkelse kommer det likevel en
  # kjøring hver time, også om morgenen. Hentingen er den samme hver gang, og bare nye saker publiseres
  # (avgjørelse 084, tillegg 09.10.2026, og 098). Repoet er offentlig, så kjøringene koster ikke Actions-minutter.
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/hent-nyheter.ts'
      - 'scripts/nyheter/**'
      - 'content/nyheter/**'
      - '.github/workflows/nyheter.yml'

concurrency:
  group: nyheter-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  hent:
    name: Hent nyhetene
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pages: read
    outputs:
      publiser: ${{ steps.lagre.outputs.publiser }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Sakene og statusen fra forrige gang, så hentingen kan beholde saker som har falt ut av en feed, og vite hvor
      # lenge en kilde har feilet. Før grenen nyheter finnes, brukes filen som er publisert på jukselappen.no.
      - name: Adressen til appen
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v6
      - name: Hent nyhetene fra forrige gang
        id: forrige
        env:
          ADRESSE: ${{ steps.pages.outputs.base_url }}
        run: |
          mkdir -p .generert data/nyheter
          if git fetch --depth=1 origin nyheter; then
            git show FETCH_HEAD:nyheter.json > data/nyheter/nyheter.json
            echo fra=gren >> "$GITHUB_OUTPUT"
          elif [ -n "$ADRESSE" ] && curl -fsSL --max-time 30 "$ADRESSE/data/nyheter/nyheter.json" -o .generert/publisert.json && jq -e '.saker' .generert/publisert.json >/dev/null; then
            echo "Ingen gren som heter nyheter ennå. Begynner med nyhetene som er publisert."
            mv .generert/publisert.json data/nyheter/nyheter.json
            echo fra=publisert >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Fant ingen nyheter fra før. Begynner på nytt."
            echo fra=ingen >> "$GITHUB_OUTPUT"
          fi
          if [ -f data/nyheter/nyheter.json ]; then cp data/nyheter/nyheter.json .generert/nyheter-forrige.json; fi
      - name: Hent nyhetene
        run: |
          set -o pipefail
          npm run --silent hent:nyheter -- --rapport | tee .generert/nyheter-rapport.txt
          {
            echo '## Nyhetene'
            echo
            echo '```'
            grep -E '^(Nyheter:|[a-z0-9-]+: [0-9]+ i feeden|  [a-z0-9-]+: (feilet|tom))' .generert/nyheter-rapport.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Prøvekildene
        if: github.event_name != 'schedule'
        continue-on-error: true
        run: npm run --silent nyheter:prove | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Test nyhetene
        run: npx vitest run tests/unit/nyheter.test.ts
      # Saken om nyhetskilder som ikke har kunnet hentes på mer enn to dager (etikett «nyheter», avgjørelse 085).
      - name: Sak om nyhetskilder som ikke kan hentes
        if: github.event_name != 'pull_request'
        run: npm run --silent nyheter:varsle
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # Grenen har bare én commit, som skrives over (avgjørelse 098). En push med GITHUB_TOKEN starter ingen
      # arbeidsflyter. Appen publiseres etter hver henting, også når bare tidspunktet eller statusen for en kilde er
      # endret, så appen viser når nyhetene sist ble hentet (avgjørelse 116).
      - name: Lagre nyhetene på grenen nyheter
        id: lagre
        if: github.event_name != 'pull_request'
        env:
          FRA: ${{ steps.forrige.outputs.fra }}
        run: |
          f=data/nyheter/nyheter.json
          forrige=.generert/nyheter-forrige.json
          if [ "$FRA" = gren ] && cmp -s "$f" "$forrige"; then
            echo "Nyhetene er uendret."
            echo publiser=nei >> "$GITHUB_OUTPUT"
            exit 0
          fi
          export GIT_AUTHOR_NAME="github-actions[bot]" GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME" GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          blob=$(git hash-object -w "$f")
          tree=$(printf '100644 blob %s\tnyheter.json\n' "$blob" | git mktree)
          commit=$(git commit-tree "$tree" -m "Nyheter $(date -u '+%F %H.%M')")
          git push --force origin "$commit:refs/heads/nyheter"
          if [ -s "$forrige" ] && [ "$(jq -cS '.saker' "$f")" = "$(jq -cS '.saker' "$forrige")" ]; then
            echo "Ingen nye saker. Appen publiseres likevel, så tidspunktet for hentingen er det siste."
          fi
          echo publiser=ja >> "$GITHUB_OUTPUT"

  publiser:
    name: Publiser med nyhetene
    needs: hent
    if: needs.hent.outputs.publiser == 'ja'
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ''
    # issues: write trengs av varseljobben i deploy.yml, som bare går når «Publiser» er startet for seg.
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write
      issues: write

  # Varsel til eier når hentingen eller publiseringen feiler, og lukking når den går bra igjen (avgjørelse 085).
  varsle:
    name: Varsle eier
    needs: [hent, publiser]
    if: always() && github.event_name != 'pull_request' && !contains(needs.*.result, 'cancelled')
    uses: ./.github/workflows/varsle.yml
    with:
      resultat: ${{ contains(needs.*.result, 'failure') && 'feilet' || 'ok' }}
    permissions:
      contents: read
      issues: write
      actions: read

  # Oppetiden (avgjørelse 099). Sjekken får feile uten at kjøringen feiler, så GitHub ikke sender sin egen e-post i
  # tillegg til saken. Får ikke jobben adressen fra GitHub Pages, hoppes sjekken over.
  oppe:
    name: Oppetid
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: read
    outputs:
      utfall: ${{ steps.sjekk.outcome }}
    steps:
      - id: pages
        continue-on-error: true
        uses: actions/configure-pages@v6
      - name: Sjekk at jukselappen.no svarer
        id: sjekk
        if: steps.pages.outputs.base_url != ''
        continue-on-error: true
        env:
          ADRESSE: ${{ steps.pages.outputs.base_url }}
        run: |
          svarer() { curl -fsS -o /dev/null --max-time 30 --retry 2 --retry-delay 10 --retry-all-errors "$ADRESSE/?oppetid=${GITHUB_RUN_ID}-$1"; }
          if svarer 1; then echo "$ADRESSE/ svarer."; exit 0; fi
          echo "$ADRESSE/ svarte ikke. Prøver igjen om ti minutter."
          sleep 600
          if svarer 2; then echo "$ADRESSE/ svarer igjen."; exit 0; fi
          echo "::error::$ADRESSE/ har ikke svart to ganger på rad, med ti minutters mellomrom."
          exit 1

  # Egen sak for oppetiden («Feil i automatikken: Oppetid»), som lukkes når siden svarer igjen.
  varsle-oppetid:
    name: Varsle eier om oppetiden
    needs: [oppe]
    if: always() && needs.oppe.result == 'success' && needs.oppe.outputs.utfall != 'skipped'
    uses: ./.github/workflows/varsle.yml
    with:
      resultat: ${{ needs.oppe.outputs.utfall == 'failure' && 'feilet' || 'ok' }}
      delfeil: Sjekk at jukselappen.no svarer
      navn: Oppetid
      jobber: Oppetid
    permissions:
      contents: read
      issues: write
      actions: read
